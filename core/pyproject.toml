[project]
name = "tarab-core"
version = "0.1.0"
description = "tarab engine: find, verify and file DJ-quality tracks from Soulseek (via slskd)"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["numpy>=2", "requests>=2.31"]

[project.scripts]
tarab = "tarab_core.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tarab_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: hits real web APIs (deselect with -m 'not network')"]
